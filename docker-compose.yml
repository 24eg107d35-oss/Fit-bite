services:
  mysql:
    image: mysql:8.4
    container_name: fitbite-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fitbite}
      MYSQL_USER: ${DB_USERNAME:-fitbite}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fitbite_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "3307:3306"
    volumes:
      - fitbite_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fitbite}
      DB_USERNAME: ${DB_USERNAME:-fitbite}
      DB_PASSWORD: ${DB_PASSWORD:-fitbite_password}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-real-secret-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fitbite_mysql:
